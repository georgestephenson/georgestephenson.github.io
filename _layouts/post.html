---
layout: default
---

<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%B %-d, %Y" }}
    </time>
    {% if page.tags.size > 0 %}
      · {% for tag in page.tags %}<span class="post-tag">{{ tag }}</span>{% endfor %}
    {% endif %}
  </p>

  {{ content }}

  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">← Back to all posts</a></p>
</article>

{% if page.mermaid %}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  // kramdown renders ```mermaid fences as <pre><code class="language-mermaid">;
  // rewrite them into the <pre class="mermaid"> shape mermaid expects, and wrap
  // each in a <figure> with the fence's data-caption as a <figcaption> + label.
  document.querySelectorAll('code.language-mermaid').forEach(function (code) {
    var pre = code.parentElement;
    var caption = pre.getAttribute('data-caption');
    pre.classList.add('mermaid');
    pre.textContent = code.textContent;

    var figure = document.createElement('figure');
    figure.className = 'diagram';
    pre.parentNode.insertBefore(figure, pre);
    figure.appendChild(pre);

    if (caption) {
      // Give the rendered diagram an accessible name as well as a visible caption.
      pre.setAttribute('role', 'img');
      pre.setAttribute('aria-label', caption);
      var fc = document.createElement('figcaption');
      fc.textContent = caption;
      figure.appendChild(fc);
    }
  });
  mermaid.initialize({ startOnLoad: true });
</script>
{% endif %}
