<figure>
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt }}"
       {% if include.width %}width="{{ include.width }}" {% endif %}{% if include.height %}height="{{ include.height }}" {% endif %}loading="lazy" decoding="async">
  {%- if include.caption %}
  {%- comment %}
    markdownify so captions can contain links/emphasis; it wraps output in <p>,
    which is invalid inside <figcaption>, so unwrap it.
  {%- endcomment %}
  <figcaption>{{ include.caption | markdownify | remove: '<p>' | remove: '</p>' | strip }}</figcaption>
  {%- endif %}
</figure>
