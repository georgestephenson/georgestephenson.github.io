title: George Stephenson
tagline: Tech Lead
description: >-
  George Stephenson — Tech Lead in London. 9 years building enterprise
  systems and leading the teams behind them.
author:
  name: George Stephenson
  # Used by jekyll-seo-tag for Twitter card attribution (leave blank if none).
  twitter:
lang: en
# Set this to your live URL so jekyll-seo-tag can build absolute Open Graph URLs.
url: "https://geosona.com"

# Default image for link previews (Open Graph / Twitter cards).
image: /img/george.webp

# Surfaced by jekyll-seo-tag as JSON-LD sameAs links.
social:
  name: George Stephenson
  links:
    - https://github.com/georgestephenson
    - https://www.linkedin.com/in/geoste/

# Pretty URLs: projects.md -> /projects/ instead of /projects.html
permalink: pretty

# Minify the compiled CSS (strips comments/whitespace, ~30-40% smaller).
sass:
  style: compressed

plugins:
  - jekyll-seo-tag   # <title>, meta description, Open Graph, Twitter cards, JSON-LD
  - jekyll-feed      # /feed.xml RSS for the blog
  - jekyll-sitemap   # /sitemap.xml for search engines

# Files/folders Jekyll should not copy into the built site.
# NOTE: setting `exclude` replaces Jekyll's defaults, so node_modules etc. must
# be listed explicitly or the JS test tooling ends up in _site and the sitemap.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - unlighthouse.config.ts
  - _config_test.yml
