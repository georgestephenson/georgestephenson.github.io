name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java (for the W3C vnu HTML validator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JS test tools
        run: npm ci

      - name: Lint SCSS (stylelint)
        run: npm run lint:css

      - name: Build site
        run: npm run build

      # --- Deterministic guarantees ---
      - name: Validate HTML (W3C vnu)
        run: npm run test:html

      - name: Check links, images, alt text, OpenGraph (html-proofer)
        run: npm run test:proof

      # --- Browser-based scanners (served build) ---
      - name: Accessibility (pa11y-ci, WCAG2AA) + performance/SEO (unlighthouse)
        run: npm run test:live
